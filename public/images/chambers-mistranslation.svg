<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Illustration: two columns of a court document, English original and Spanish translation, with three mistranslated phrases marked">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a36"/><stop offset="1" stop-color="#14264a"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="630" fill="#007A3D"/>
  <rect x="14" y="0" width="8" height="630" fill="#7a1f2b"/>
  <text x="70" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#ffffff">Three errors in the evidence</text>
  <text x="70" y="120" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9d3e6" letter-spacing="1.5">ADMITTED BY THE US JUSTICE DEPARTMENT · 18 NOVEMBER 2026</text>

  <g filter="url(#sh)">
    <rect x="70" y="160" width="480" height="340" rx="6" fill="#f6f1e7"/>
    <rect x="650" y="160" width="480" height="340" rx="6" fill="#f6f1e7"/>
  </g>
  <text x="100" y="204" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#14264a" letter-spacing="2">ENGLISH · THE ORIGINAL</text>
  <text x="680" y="204" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7a1f2b" letter-spacing="2">SPANISH · AS FILED IN COURT</text>
  <line x1="100" y1="220" x2="520" y2="220" stroke="#14264a" stroke-opacity=".25"/>
  <line x1="680" y1="220" x2="1100" y2="220" stroke="#7a1f2b" stroke-opacity=".25"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="30">
    <text x="100" y="282" fill="#1c1c1c">1.  direct action</text>
    <text x="100" y="372" fill="#1c1c1c">2.  trespass</text>
    <text x="100" y="462" fill="#1c1c1c">3.  damage to a building</text>
    <text x="680" y="282" fill="#7a1f2b" font-weight="700">1.  violencia</text>
    <text x="680" y="372" fill="#7a1f2b" font-weight="700">2.  intrusion in a home</text>
    <text x="680" y="462" fill="#7a1f2b" font-weight="700">3.  damage, “fires” added</text>
  </g>
  <g fill="#7a1f2b" fill-opacity=".12">
    <rect x="670" y="246" width="440" height="52" rx="4"/>
    <rect x="670" y="336" width="440" height="52" rx="4"/>
    <rect x="670" y="426" width="440" height="52" rx="4"/>
  </g>
  <g stroke="#7a1f2b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M556 272 L644 272"/><path d="M634 262 L646 272 L634 282"/>
    <path d="M556 362 L644 362"/><path d="M634 352 L646 362 L634 372"/>
    <path d="M556 452 L644 452"/><path d="M634 442 L646 452 L634 462"/>
  </g>
  <text x="70" y="548" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9d3e6">The US says a private translation firm made the errors and that they were unintentional.</text>
  <text x="70" y="582" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8fa0c2">Illustration: The Ceylon Review. Not a photograph.</text>
</svg>
